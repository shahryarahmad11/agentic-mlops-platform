[project]
name = "agentic-mlops-platform"
version = "0.1.0"
description = "AI-powered MLOps agent orchestrating DVC, MLflow, Apache Airflow 3 and Kubernetes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "mlflow>=3.0",
    "dvc>=3.50",
    "kubernetes>=30.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "google-genai>=3.3.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mlartifacts", "pipeline_artifacts"]

[tool.ruff.lint.isort]
# The repo's kubernetes/ manifest folder must not make the client look first-party.
known-third-party = ["kubernetes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
