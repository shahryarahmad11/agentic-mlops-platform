# Non-sensitive configuration only. Secrets never go in a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-api-config
  namespace: mlops
  labels:
    app.kubernetes.io/name: prediction-api
data:
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  MODEL_PATH: "/app/model/model.joblib"
  MODEL_METADATA_PATH: "/app/model/metadata.json"
